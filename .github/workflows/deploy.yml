name: Build and Deploy

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

# 同一时刻只允许一个部署：新的推送会取消进行中的旧部署，避免旧构建后完成并覆盖新内容
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  # 先过 CI：lint、类型检查、单元测试、依赖审计门禁、构建与端到端测试，任何一项失败都不会部署。
  # 文章机器人直接推 source，这道门禁是它的产出上线前唯一的检查。
  validate:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run generate

      - name: Ensure .nojekyll
        run: touch .output/public/.nojekyll

      - name: Deploy to master (GitHub Pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: .output/public
          keep_files: false
          commit_message: "Site deployed from source@${{ github.sha }}"
