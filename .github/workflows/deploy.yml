name: Build and Deploy

on:
  push:
    branches: [source]
  workflow_dispatch:

# 第三方 Action 固定到提交哈希，版本写在行尾注释里（由 Dependabot 提升级 PR）；本流水线持有仓库的写权限
permissions:
  contents: write

# 同一时刻只允许一个部署：新的推送会取消进行中的旧部署，避免旧构建后完成并覆盖新内容
concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  # 先过 CI：lint、类型检查、单元测试、依赖审计门禁、构建与端到端测试，任何一项失败都不会部署。
  # 文章机器人直接推 source，这道门禁是它的产出上线前唯一的检查。
  validate:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run generate

      - name: Ensure .nojekyll
        run: touch .output/public/.nojekyll

      - name: Deploy to master (GitHub Pages)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: master
          publish_dir: .output/public
          keep_files: false
          commit_message: "Site deployed from source@${{ github.sha }}"
