name: CI

# PR 上运行；也可以被其它流水线以 workflow_call 复用（见 deploy.yml：校验通过才会部署）。
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 第三方 Action 固定到提交哈希；版本写在行尾注释里，Dependabot 会据此提升级 PR。
jobs:
  static:
    name: Lint 与类型检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: 单元测试、依赖审计与端到端测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      # 单元测试 + 依赖审计门禁（见 audit-allowlist.json）
      - run: npm test

      - run: npx playwright install --with-deps chromium
      # 用例内部会先执行 nuxt generate，测的是当前代码的静态产物
      - run: npm run test:e2e

      - name: 失败时保留端到端测试报告
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  commits:
    name: 提交信息规范
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 需要拿到 PR 基点提交才能确定检查范围
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: 检查本 PR 包含的提交
        run: npx commitlint --from "${{ github.event.pull_request.base.sha }}" --to "${{ github.event.pull_request.head.sha }}"
